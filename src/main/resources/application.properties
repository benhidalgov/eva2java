# ============================================================
# EventPass - Configuración de la aplicación
# ============================================================

spring.application.name=eventpass
server.port=8081

# ------------------------------------------------------------
# 1) CONEXIÓN A LA BASE DE DATOS (H2 en modo archivo)
#    Los datos persisten en ./data/eventpass.mv.db entre corridas.
#    Consola de inspección: http://localhost:8080/h2-console
#    JDBC URL : jdbc:h2:file:./data/eventpass
# ------------------------------------------------------------
spring.datasource.url=jdbc:h2:file:./data/eventpass
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ------------------------------------------------------------
# 2) JPA / HIBERNATE
#    update: genera y actualiza el esquema a partir de las entidades.
# ------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Fechas en formato ISO en vez de arrays de timestamp
spring.jackson.serialization.write-dates-as-timestamps=false

# ------------------------------------------------------------
# 3) CONSOLA H2
# ------------------------------------------------------------
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ------------------------------------------------------------
# 4) CARGA INICIAL DE DATOS (data.sql)
#    defer: ejecuta el script DESPUÉS de que Hibernate crea las tablas.
# ------------------------------------------------------------
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# ------------------------------------------------------------
# 5) ACTUATOR (salud e info de la API)
# ------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
