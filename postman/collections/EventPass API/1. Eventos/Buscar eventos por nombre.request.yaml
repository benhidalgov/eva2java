$kind: http-request
method: GET
url: '{{baseUrl}}/api/eventos'
order: 2000
queryParams:
  - key: nombre
    value: festival
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('El nombre contiene el filtro', () => pm.expect(pm.response.json()[0].nombre.toLowerCase()).to.include('festival'));
